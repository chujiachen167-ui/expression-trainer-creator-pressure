<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V2 数字观众压力场 · Expression Trainer</title>
  <script>try { const entry = JSON.parse(sessionStorage.getItem('expression-trainer.scroll-expand.entry') || 'null'); if (entry?.mode === 'v2') { document.documentElement.classList.add('scroll-expand-entry-pending'); document.documentElement.dataset.scrollExpandMode = entry.mode; document.documentElement.dataset.scrollExpandDirection = entry.direction || 'up'; } } catch (_) {}</script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="drift-wall.css">
  <link rel="stylesheet" href="v2-focus.css">
  <script src="locales/zh-CN.js"></script>
  <script src="locales/en-US.js"></script>
  <script src="i18n.js"></script>
</head>
<body class="trainer-page" data-mode="v2" data-i18n-title="page.v2.title">
  <header class="topbar">
    <a class="back-link" href="index.html" data-i18n="common.backOverview">← 三版总览</a>
    <span class="brand">Expression Trainer</span>
    <span class="version-pill">V2 数字观众压力场</span>
    <span class="topbar-spacer"></span>
    <span class="timer" id="timer">00:00</span>
    <button class="ghost-btn" type="button" data-camera-toggle data-i18n="common.openCamera">开启摄像头</button>
  </header>

  <main class="workspace">
    <aside class="side-panel left">
      <h2 class="panel-heading" data-i18n="v2.setup.title">训练设置</h2>
      <div data-v2-topic-slot></div>

      <h2 class="panel-heading" data-qa-copy-added data-qa-copy-key="v2.setup.pressure">压力等级</h2>
      <div class="pressure-group">
        <button class="pressure-btn" data-pressure="low">低压</button>
        <button class="pressure-btn active" data-pressure="medium">中压</button>
        <button class="pressure-btn" data-pressure="high">高压</button>
      </div>
    </aside>

    <section class="stage">
      <div class="stage-head">
        <div>
          <div class="v2-take-kicker" aria-hidden="true"><span></span><b>CREATOR TAKE</b><em data-v2-pressure-label>中压模式</em></div>
          <h1 data-i18n="v2.title">一个真正会反应的观众</h1>
          <p data-i18n="v2.subtitle">压力来自内容追问，而不是装饰性头像。</p>
        </div>
        <div class="stage-status" data-stt-state="idle" role="status" aria-live="polite"><span class="status-dot"></span><span id="statusText" data-i18n="common.waiting">等待开始</span><button type="button" data-stt-retry hidden data-i18n="common.retry">重试</button></div>
      </div>

      <div class="room duo-room audience-primary-room">
        <div class="audience-primary-stage" id="v2AudienceStage">
          <div id="avatarDriftWall" class="avatar-drift-preview" aria-label="数字观众形象预览"></div>
          <div class="audience-live-slot" data-primary-audience hidden></div>
          <div class="audience-preview-caption"><span>数字观众预览</span><strong>先选择受众模板，再进入压力训练</strong></div>
          <section class="v2-interest-panel" data-v2-interest-panel data-qa-copy-ignore aria-label="模拟观众兴趣趋势"></section>
        </div>
        <div class="video-tile creator-mini-tile" id="v2CreatorStage">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <div class="video-off">开启摄像头<br>检查自己的镜头状态</div>
          <div class="camera-target" aria-label="镜头注视位置"></div>
          <span class="tile-label">你 · 创作者</span>
        </div>
        <div class="prompt-banner"><strong>训练题：</strong> <span id="sessionPrompt"></span></div>
      </div>

      <section class="v2-transcript-desk" aria-label="实时口述场记">
        <header class="v2-transcript-head" data-qa-copy-ignore>
          <div><span class="v2-live-mark" aria-hidden="true"></span><strong>LIVE TRANSCRIPT</strong><b>实时口述</b></div>
          <span>自动记录</span>
        </header>
        <div class="transcript" id="liveTranscript"></div>
        <div class="loading-row"><span class="spinner"></span><span>正在比较自然状态与压力状态，并生成下一轮动作…</span></div>
        <div class="controls">
          <button class="primary-btn" type="button" data-session-toggle data-i18n="v2.start">开始压力口播</button>
          <span class="control-note">数字观众会按当前压力等级，在训练中提出内容相关的约束。</span>
        </div>
      </section>
      <details class="v2-session-report" data-v2-report hidden>
        <summary data-i18n="v2.report.open">生成诊断报告</summary>
        <div data-v2-word-review></div>
        <div data-v2-review-host></div>
      </details>
    </section>

    <aside class="side-panel right">
      <button type="button" class="v2-feedback-toggle" aria-expanded="true" aria-controls="v2FeedbackBody" aria-label="收起实时反馈" title="收起实时反馈"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 7-5 5 5 5"/><path d="m19 7-5 5 5 5"/></svg></button>
      <div class="v2-feedback-header">
        <h2 class="panel-heading" data-i18n="v2.feedback.title">实时反馈</h2>
      </div>
      <div id="v2FeedbackBody">
        <div data-v2-feedback-content></div>
        <div class="event-feed diagnostic-feedback" id="eventFeed"></div>
        <div data-v2-chart-context></div>
      </div>
    </aside>
  </main>
  <script src="creator-project-config.js"></script>
  <script src="v2-focus.js"></script>
  <script src="vertical-marquee-config.js"></script>
  <script src="qa-element-editor.js"></script>
  <script src="brand-logo.js"></script>
  <script src="config-file-store.js"></script>
  <script src="control-panel.js"></script>
  <script src="launcher-scroll-expand.js"></script>
  <script src="drift-wall.js"></script>
  <script src="audience-templates.js"></script>
  <script src="avatar-provider.js"></script>
  <script src="avatar-selector.js"></script>
  <script src="v2-session-model.js"></script>
  <script src="v2-rule-judge.js"></script>
  <script src="v2-review.js"></script>
  <script src="expression-analysis.js"></script>
  <script src="v2-interest-panel.js"></script>
  <script src="web-stt.js"></script>
  <script src="stt-audio.js?v=0.2.1"></script>
  <script src="app.js"></script>
  <script src="v2-topic-picker.js"></script>
</body>
</html>
